name: AVIA Authenticated PWA Install

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avia-profile-pwa-install.yml'
  workflow_run:
    workflows: ['AVIA Menu Cleanup']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: avia-profile-pwa-install
  cancel-in-progress: true

jobs:
  add-profile-install:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: avia-web-dist
          fetch-depth: 0

      - name: Add install control inside authenticated Profile only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          card = (
              '<div id="profileInstallPwaCard" class="card">\n'
              '  <h3 style="margin-top:0">📲 Pasang AVIA</h3>\n'
              '  <div class="note">Pasang AVIA pada skrin utama telefon untuk akses lebih cepat. Pilihan ini hanya tersedia selepas anda log masuk.</div>\n'
              '  <button id="profileInstallPwaBtn" type="button" style="width:100%;margin-top:10px">Pasang AVIA</button>\n'
              '  <div id="profileInstallPwaMsg" class="muted" style="margin-top:8px"></div>\n'
              '</div>\n'
          )

          if 'id="profileInstallPwaCard"' not in s:
              marker='<div id="biometricCard" class="card" style="margin-top:12px">'
              if marker not in s:
                  raise SystemExit('Profile biometric marker not found')
              s=s.replace(marker,card+'\n'+marker,1)

          script = (
              '<script id="aviaAuthenticatedPwaInstall">\n'
              '(function(){\n'
              '  let deferredPrompt=null;\n'
              "  const btn=()=>document.getElementById('profileInstallPwaBtn');\n"
              "  const msg=()=>document.getElementById('profileInstallPwaMsg');\n"
              "  const standalone=()=>window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;\n"
              '  const sync=()=>{\n'
              '    const b=btn(),m=msg();\n'
              '    if(!b)return;\n'
              '    if(standalone()){\n'
              "      b.classList.add('hidden');\n"
              "      if(m)m.textContent='✓ AVIA sudah dipasang pada peranti ini.';\n"
              '    }else{\n'
              "      b.classList.remove('hidden');\n"
              "      if(m&&!m.textContent)m.textContent='Jika prompt tidak keluar, buka menu Chrome dan pilih Install app / Add to Home screen.';\n"
              '    }\n'
              '  };\n'
              "  window.addEventListener('beforeinstallprompt',e=>{\n"
              '    e.preventDefault();\n'
              '    deferredPrompt=e;\n'
              '    sync();\n'
              '  });\n'
              "  window.addEventListener('appinstalled',()=>{\n"
              '    deferredPrompt=null;\n'
              '    sync();\n'
              '  });\n'
              "  document.addEventListener('click',async e=>{\n"
              "    if(e.target?.id!=='profileInstallPwaBtn')return;\n"
              '    const m=msg();\n'
              '    if(standalone()){sync();return;}\n'
              '    if(deferredPrompt){\n'
              '      deferredPrompt.prompt();\n'
              '      try{\n'
              '        const choice=await deferredPrompt.userChoice;\n'
              "        if(m)m.textContent=choice?.outcome==='accepted'?'Pemasangan AVIA diterima.':'Pemasangan dibatalkan.';\n"
              '      }catch(_){\n'
              "        if(m)m.textContent='Gunakan menu Chrome → Install app / Add to Home screen.';\n"
              '      }\n'
              '      deferredPrompt=null;\n'
              '    }else if(m){\n'
              "      m.textContent='Buka menu Chrome (⋮) → Install app / Add to Home screen.';\n"
              '    }\n'
              '  });\n'
              '  sync();\n'
              '})();\n'
              '</script>'
          )

          if 'id="aviaAuthenticatedPwaInstall"' not in s:
              if '</body>' not in s:
                  raise SystemExit('body closing tag not found')
              s=s.replace('</body>',script+'\n</body>',1)

          p.write_text(s,encoding='utf-8')
          PY

          sed -i "s/avia-web-v12/avia-web-v13/g; s/avia-web-v11/avia-web-v13/g; s/avia-web-v10/avia-web-v13/g" sw.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          login=re.search(r'<section id="loginView"[\s\S]*?</section>',s)
          if not login:
              raise SystemExit('login section not found')
          if 'profileInstallPwaBtn' in login.group(0) or 'profileInstallPwaCard' in login.group(0):
              raise SystemExit('Install control leaked into public login')
          if 'id="profileInstallPwaBtn"' not in s:
              raise SystemExit('Authenticated install button missing')
          if 'id="aviaAuthenticatedPwaInstall"' not in s:
              raise SystemExit('Authenticated install handler missing')
          PY

      - name: Validate browser JavaScript before publishing
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs');
          const vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          let count=0;
          for(const match of html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)){
            new vm.Script(match[1],{filename:'inline-'+(++count)+'.js'});
          }
          if(!count)throw new Error('No browser scripts found');
          console.log(count+' browser scripts passed syntax validation');
          JS

      - name: Publish authenticated install control
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Authenticated install control already present.'
            exit 0
          fi
          git config user.name 'AVIA UI Build'
          git config user.email 'actions@github.com'
          git add index.html sw.js
          git commit -m 'Add Pasang AVIA to authenticated Profile'
          git push origin HEAD:avia-web-dist
