name: AVIA Menu Cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avia-menu-close-fix.yml'
  workflow_run:
    workflows: ['AVIA Web Security Hardening']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: avia-menu-close-fix
  cancel-in-progress: true

jobs:
  clean-menu:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: avia-web-dist
          fetch-depth: 0

      - name: Remove redundant close menu control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # The drawer already closes when a menu item is selected and when the
          # user taps the dark backdrop, so a separate Close Menu button is redundant.
          s=re.sub(
              r'<button id="closeMenu" class="drawerItem"(?: type="button")?>.*?</button>',
              '',
              s,
              count=1,
              flags=re.S,
          )

          # Remove the old direct handler so deleting the button cannot cause a JS error.
          s=s.replace(";g('closeMenu').onclick=()=>g('drawer').classList.add('hidden');", ";")

          # Remove the complete legacy block using the next comment as a boundary.
          # Matching the first closing brace truncates the nested event handler.
          s=re.sub(
              r'\n[ \t]*// Drawer close remains explicit\.[\s\S]*?(?=\n[ \t]*// Dark backdrop closes drawer)',
              '\n',
              s,
              count=1,
          )
          # Repair the exact orphan left by the previous cleanup on existing builds.
          s=s.replace(
              "btn.addEventListener('touchend',openDrawerNow,{passive:false,capture:true});\n;\n  }",
              "btn.addEventListener('touchend',openDrawerNow,{passive:false,capture:true});",
          )

          # Remove the dedicated close-menu patch script added previously.
          s=re.sub(
              r'\s*<script id="aviaCloseMenuFix">.*?</script>\s*',
              '\n',
              s,
              count=1,
              flags=re.S,
          )

          p.write_text(s,encoding='utf-8')
          PY

          # Bust PWA cache so the simplified drawer appears immediately.
          sed -i "s/avia-web-v11/avia-web-v12/g; s/avia-web-v10/avia-web-v12/g; s/avia-web-v9/avia-web-v12/g; s/avia-web-v8/avia-web-v12/g; s/avia-web-v7/avia-web-v12/g" sw.js

          ! grep -q 'id="closeMenu"' index.html
          ! grep -q 'aviaCloseMenuFix' index.html
          grep -q 'avia-web-v12' sw.js

      - name: Validate browser JavaScript before publishing
        shell: bash
        run: |
          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          let count = 0;
          for (const match of html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)) {
            new vm.Script(match[1], {filename: 'inline-' + (++count) + '.js'});
          }
          if (!count) throw new Error('No browser scripts found');
          console.log(count + ' browser scripts passed syntax validation');
          JS

      - name: Publish menu cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Menu already clean.'
            exit 0
          fi
          git config user.name 'AVIA UI Build'
          git config user.email 'actions@github.com'
          git add index.html sw.js
          git commit -m 'Repair AVIA blank screen and keep Tutup Menu removed'
          git push origin HEAD:avia-web-dist
