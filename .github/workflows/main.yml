name: Build Android APK AVIA v6.9q

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip AVIA v6.9q project
        run: |
          unzip -o AVIA-Android-v6_9q-RoleBasedStatus-Project.zip -d extracted
          ls -la extracted

      - name: Build AVIA v6.9q
        run: |
          cd extracted/AVIA-Android-v6_9q
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVIA-v6_9q-APK
          path: extracted/AVIA-Android-v6_9q/app/build/outputs/apk/debug/app-debug.apk
