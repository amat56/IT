name: Build Android APK v5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip v5 project
        run: |
          ZIP=$(find . -maxdepth 1 -name "MyUnitCalendar-Android-v5-Project.zip" | head -n 1)
          echo "ZIP found: $ZIP"
          unzip -o "$ZIP" -d extracted
          find extracted -maxdepth 3 -type f | head -50

      - name: Build APK v5
        run: |
          cd extracted/MyUnitCalendar-Android-v5
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyUnitCalendar-v5-APK
          path: extracted/MyUnitCalendar-Android-v5/app/build/outputs/apk/debug/app-debug.apk
