name: Build AVIA Supabase Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - avia-v6_9bi-supabase-live

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract proven v6.9bi source
        run: |
          rm -rf extracted overlay.b64 overlay.tar.xz
          mkdir -p extracted
          unzip -o AVIA-Android-v6_9bi-PrayerActiveHighlight-Project.zip -d extracted
          test -f extracted/AVIA-Android-v6_9bi/app/src/main/assets/index.html

      - name: Apply Supabase Live overlay
        run: |
          cat live_overlay/overlay.part00 live_overlay/overlay.part01 live_overlay/overlay.part02 live_overlay/overlay.part03 live_overlay/overlay.part04 live_overlay/overlay.part05 > overlay.b64
          base64 -d overlay.b64 > overlay.tar.xz
          tar -xJf overlay.tar.xz -C extracted/AVIA-Android-v6_9bi
          grep -q "AVIA_SUPABASE_FIXED" extracted/AVIA-Android-v6_9bi/app/src/main/assets/index.html
          grep -q "AVIA_STAFF_TEMP_PASSWORD" extracted/AVIA-Android-v6_9bi/app/src/main/assets/index.html
          grep -q "hdfshop2010@gmail.com" extracted/AVIA-Android-v6_9bi/app/src/main/assets/index.html
          grep -q "6.9bi-live" extracted/AVIA-Android-v6_9bi/app/build.gradle

      - name: Apply fixed staff display order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('extracted/AVIA-Android-v6_9bi/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          marker="function toggleStaffUnit(id){const el=g(id);if(el)el.classList.toggle('collapsed')}"
          helper="""const AVIA_STAFF_DISPLAY_ORDER=[
          'KHAIRANI FAIDZAH BINTI DOLAH',
          'NUR BALKIS BINTI YAACOB',
          'AIN SYAHEERA BINTI ABD RAHMAN',
          'MOHD KHAIRI BIN ZAKARIA',
          'MOHAMAD TAZLY BIN YAHYA',
          'IZZUWAN HAKIM BIN KAMARUZZAMAN'
          ];
          const AVIA_STAFF_DISPLAY_RANK=new Map(AVIA_STAFF_DISPLAY_ORDER.map((n,i)=>[n,i]));
          function sortAviaStaff(list){return [...list].sort((a,b)=>{const an=String(a?.full_name||a?.email||'').trim().toUpperCase(),bn=String(b?.full_name||b?.email||'').trim().toUpperCase(),ar=AVIA_STAFF_DISPLAY_RANK.has(an)?AVIA_STAFF_DISPLAY_RANK.get(an):9999,br=AVIA_STAFF_DISPLAY_RANK.has(bn)?AVIA_STAFF_DISPLAY_RANK.get(bn):9999;if(ar!==br)return ar-br;return an.localeCompare(bn,'ms')})}
          """
          if 'AVIA_STAFF_DISPLAY_ORDER' not in s:
              if marker not in s: raise SystemExit('staff render marker not found')
              s=s.replace(marker,helper+marker,1)
          old_people="const people=groups[u].sort((a,b)=>(a.full_name||a.email||'').localeCompare((b.full_name||b.email||''),'ms'));"
          if old_people not in s: raise SystemExit('staff list sort marker not found')
          s=s.replace(old_people,"const people=sortAviaStaff(groups[u]);")
          old_today="return scopeStaff().filter(s=>(`${s.full_name||''} ${s.email||''}`).toLowerCase().includes(q));"
          if old_today not in s: raise SystemExit('today staff sort marker not found')
          s=s.replace(old_today,"return sortAviaStaff(scopeStaff().filter(s=>(`${s.full_name||''} ${s.email||''}`).toLowerCase().includes(q)));",1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "AVIA_STAFF_DISPLAY_ORDER" extracted/AVIA-Android-v6_9bi/app/src/main/assets/index.html
          grep -q "const people=sortAviaStaff(groups\[u\])" extracted/AVIA-Android-v6_9bi/app/src/main/assets/index.html

      - name: Build APK
        run: |
          cd extracted/AVIA-Android-v6_9bi
          gradle clean assembleDebug

      - name: Verify and rename APK
        run: |
          test -f extracted/AVIA-Android-v6_9bi/app/build/outputs/apk/debug/app-debug.apk
          cp extracted/AVIA-Android-v6_9bi/app/build/outputs/apk/debug/app-debug.apk AVIA-v6_9bi-SupabaseLive.apk
          unzip -t AVIA-v6_9bi-SupabaseLive.apk >/dev/null
          sha256sum AVIA-v6_9bi-SupabaseLive.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVIA-v6_9bi-SupabaseLive-APK
          path: AVIA-v6_9bi-SupabaseLive.apk
          if-no-files-found: error
