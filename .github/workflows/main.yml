name: Build AVIA Supabase Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - avia-v6_9bi-supabase-live

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract final project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o AVIA-Android-v6_9bi-SupabaseLive-FINAL.zip -d extracted
          test -f extracted/AVIA-Android-v6_9bi-SupabaseLive/app/src/main/assets/index.html
          grep -q "AVIA_SUPABASE_FIXED" extracted/AVIA-Android-v6_9bi-SupabaseLive/app/src/main/assets/index.html
          grep -q "hdfshop2010@gmail.com" extracted/AVIA-Android-v6_9bi-SupabaseLive/app/src/main/assets/index.html

      - name: Build APK
        run: |
          cd extracted/AVIA-Android-v6_9bi-SupabaseLive
          gradle clean assembleDebug

      - name: Prepare APK
        run: |
          cp extracted/AVIA-Android-v6_9bi-SupabaseLive/app/build/outputs/apk/debug/app-debug.apk AVIA-v6_9bi-SupabaseLive.apk
          sha256sum AVIA-v6_9bi-SupabaseLive.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVIA-v6_9bi-SupabaseLive-APK
          path: AVIA-v6_9bi-SupabaseLive.apk
          if-no-files-found: error
