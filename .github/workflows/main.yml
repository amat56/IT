name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip Android project
        run: |
          ZIP=$(find . -maxdepth 1 -name "MyUnitCalendar-Android-*.zip" | head -n 1)
          echo "ZIP found: $ZIP"
          unzip -o "$ZIP" -d extracted

      - name: Build APK
        run: |
          cd extracted/MyUnitCalendar-Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyUnitCalendar-APK
          path: extracted/MyUnitCalendar-Android/app/build/outputs/apk/debug/app-debug.apk
