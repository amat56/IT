name: Build Android APK v6.7c

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip v6.7c project
        run: |
          unzip -o MyUnitCalendar-Android-v6_7c-Supabase-Project.zip -d extracted
          ls -la extracted

      - name: Build APK v6.7c
        run: |
          cd extracted/MyUnitCalendar-Android-v6_7c
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyUnitCalendar-v6_7c-APK
          path: extracted/MyUnitCalendar-Android-v6_7c/app/build/outputs/apk/debug/app-debug.apk
