name: Build AVIA Web PWA

on:
  push:
    branches:
      - avia-web-pwa
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avia-web-dist
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AVIA web files from verified live source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted web overlay.b64 overlay.tar.xz
          mkdir -p extracted web
          unzip -o AVIA-Android-v6_9bi-PrayerActiveHighlight-Project.zip -d extracted >/dev/null
          cat live_overlay/overlay.part00 live_overlay/overlay.part01 live_overlay/overlay.part02 live_overlay/overlay.part03 live_overlay/overlay.part04 live_overlay/overlay.part05 > overlay.b64
          base64 -d overlay.b64 > overlay.tar.xz
          tar -xJf overlay.tar.xz -C extracted/AVIA-Android-v6_9bi
          cp extracted/AVIA-Android-v6_9bi/app/src/main/assets/index.html web/index.html
          mkdir -p web/icons
          cp extracted/AVIA-Android-v6_9bi/app/src/main/res/drawable-nodpi/avia_launcher.png web/icons/icon-512.png

          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')

          meta = '''
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b5ea8">
<meta name="application-name" content="AVIA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AVIA">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
'''
          if 'manifest.webmanifest' not in s:
              s = s.replace('<head>', '<head>' + meta, 1)

          needle = '<button id="loginBtn">Log Masuk</button>'
          if 'installPwaBtn' not in s and needle in s:
              s = s.replace(
                  needle,
                  needle + '<button id="installPwaBtn" type="button" class="alt hidden" style="margin-left:8px">Install AVIA</button>',
                  1,
              )

          script = '''
<script>
(function(){
  let promptEvent = null;
  const button = () => document.getElementById('installPwaBtn');
  const standalone = () =>
    window.matchMedia?.('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  const hideInstall = () => button()?.classList.add('hidden');
  const showInstall = () => { if (!standalone()) button()?.classList.remove('hidden'); };

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    promptEvent = event;
    showInstall();
  });

  window.addEventListener('appinstalled', () => {
    promptEvent = null;
    hideInstall();
  });

  document.addEventListener('click', async event => {
    if (event.target?.id !== 'installPwaBtn') return;
    if (promptEvent) {
      promptEvent.prompt();
      try { await promptEvent.userChoice; } catch (_) {}
      promptEvent = null;
      hideInstall();
      return;
    }
    alert('Dalam Chrome atau Edge: buka menu browser dan pilih Install AVIA / Install app.');
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
    });
  }

  if (standalone()) hideInstall();
})();
</script>
'''
          if "navigator.serviceWorker.register('./sw.js'" not in s:
              s = s.replace('</body>', script + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

          cat > web/manifest.webmanifest <<'EOF'
          {
            "id": "./",
            "name": "AVIA — Availability & Visibility Information Application",
            "short_name": "AVIA",
            "description": "AVIA UNIT IT — pergerakan staf, status, birthday, pengumuman dan pentadbiran.",
            "lang": "ms-MY",
            "dir": "ltr",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "display_override": ["standalone", "minimal-ui"],
            "orientation": "any",
            "background_color": "#ffffff",
            "theme_color": "#0b5ea8",
            "categories": ["business", "productivity"],
            "prefer_related_applications": false,
            "icons": [
              {"src":"icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}
            ]
          }
          EOF

          cat > web/sw.js <<'EOF'
          const CACHE = 'avia-web-v2';
          const SHELL = ['./', './index.html', './manifest.webmanifest', './offline.html', './icons/icon-512.png'];

          self.addEventListener('install', event => {
            event.waitUntil(
              caches.open(CACHE)
                .then(cache => cache.addAll(SHELL))
                .then(() => self.skipWaiting())
            );
          });

          self.addEventListener('activate', event => {
            event.waitUntil(
              caches.keys()
                .then(keys => Promise.all(keys.filter(key => key !== CACHE).map(key => caches.delete(key))))
                .then(() => self.clients.claim())
            );
          });

          self.addEventListener('fetch', event => {
            const request = event.request;
            const url = new URL(request.url);

            if (request.method !== 'GET') return;
            if (url.hostname.endsWith('.supabase.co')) return;

            if (request.mode === 'navigate') {
              event.respondWith(
                fetch(request)
                  .then(response => {
                    if (response && response.ok) {
                      const copy = response.clone();
                      caches.open(CACHE).then(cache => cache.put('./index.html', copy));
                    }
                    return response;
                  })
                  .catch(() => caches.match('./index.html').then(response => response || caches.match('./offline.html')))
              );
              return;
            }

            event.respondWith(
              caches.match(request).then(cached => {
                const network = fetch(request)
                  .then(response => {
                    if (response && response.ok && url.origin === self.location.origin) {
                      const copy = response.clone();
                      caches.open(CACHE).then(cache => cache.put(request, copy));
                    }
                    return response;
                  })
                  .catch(() => cached);
                return cached || network;
              })
            );
          });
          EOF

          cat > web/offline.html <<'EOF'
          <!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5ea8"><title>AVIA Offline</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f4f7fb;color:#17324d}.box{max-width:520px;margin:20px;padding:28px;background:white;border-radius:18px;box-shadow:0 8px 30px #0001;text-align:center}.muted{opacity:.72}</style><div class="box"><h1>AVIA</h1><p>Tiada sambungan internet.</p><p class="muted">Sambungkan internet dan buka semula AVIA untuk sync data Supabase.</p></div></html>
          EOF

          cat > web/vercel.json <<'EOF'
          {
            "headers": [
              {
                "source": "/sw.js",
                "headers": [{"key":"Cache-Control","value":"public, max-age=0, must-revalidate"}]
              },
              {
                "source": "/manifest.webmanifest",
                "headers": [
                  {"key":"Content-Type","value":"application/manifest+json; charset=utf-8"},
                  {"key":"Cache-Control","value":"public, max-age=0, must-revalidate"}
                ]
              },
              {
                "source": "/(.*)",
                "headers": [
                  {"key":"X-Content-Type-Options","value":"nosniff"},
                  {"key":"Referrer-Policy","value":"strict-origin-when-cross-origin"}
                ]
              }
            ]
          }
          EOF

          printf '{"app":"AVIA","source_branch":"avia-web-pwa","source_commit":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > web/version.json
          touch web/.nojekyll

          grep -q 'AVIA_SUPABASE_FIXED' web/index.html
          grep -q 'hdfshop2010@gmail.com' web/index.html
          grep -q 'installPwaBtn' web/index.html
          grep -q "navigator.serviceWorker.register('./sw.js'" web/index.html
          grep -q "avia-web-v2" web/sw.js
          python3 -m json.tool web/manifest.webmanifest >/dev/null
          python3 -m json.tool web/vercel.json >/dev/null
          test -s web/index.html
          test -s web/manifest.webmanifest
          test -s web/sw.js
          test -s web/offline.html
          test -s web/icons/icon-512.png
          test -s web/version.json

      - name: Upload web package
        uses: actions/upload-artifact@v4
        with:
          name: AVIA-Web-PWA
          path: web
          if-no-files-found: error

      - name: Publish avia-web-dist branch
        shell: bash
        run: |
          set -euo pipefail
          tar -C web -czf /tmp/avia-web.tgz .
          git config user.name "AVIA Build"
          git config user.email "actions@github.com"
          git checkout --orphan avia-web-dist
          git rm -rf . || true
          git clean -fdx
          tar -xzf /tmp/avia-web.tgz
          git add -A
          git commit -m "Publish AVIA Web PWA"
          git push --force origin HEAD:avia-web-dist
