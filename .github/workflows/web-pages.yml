name: Build AVIA Web PWA

on:
  push:
    branches:
      - avia-web-pwa
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avia-web-dist
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AVIA web files from verified live source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted web overlay.b64 overlay.tar.xz
          mkdir -p extracted web
          unzip -o AVIA-Android-v6_9bi-PrayerActiveHighlight-Project.zip -d extracted >/dev/null
          cat live_overlay/overlay.part00 live_overlay/overlay.part01 live_overlay/overlay.part02 live_overlay/overlay.part03 live_overlay/overlay.part04 live_overlay/overlay.part05 > overlay.b64
          base64 -d overlay.b64 > overlay.tar.xz
          tar -xJf overlay.tar.xz -C extracted/AVIA-Android-v6_9bi
          cp extracted/AVIA-Android-v6_9bi/app/src/main/assets/index.html web/index.html
          mkdir -p web/icons
          cp extracted/AVIA-Android-v6_9bi/app/src/main/res/drawable-nodpi/avia_launcher.png web/icons/icon-512.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text(encoding='utf-8')
          meta='''\n<link rel="manifest" href="manifest.webmanifest">\n<meta name="theme-color" content="#0b5ea8">\n<meta name="application-name" content="AVIA">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="default">\n<meta name="apple-mobile-web-app-title" content="AVIA">\n<meta name="format-detection" content="telephone=no">\n<link rel="icon" type="image/png" href="icons/icon-512.png">\n<link rel="apple-touch-icon" href="icons/icon-512.png">\n'''
          if 'manifest.webmanifest' not in s:
              s=s.replace('<head>','<head>'+meta,1)
          needle='<button id="loginBtn">Log Masuk</button>'
          if 'installPwaBtn' not in s and needle in s:
              s=s.replace(needle,needle+'<button id="installPwaBtn" type="button" class="alt hidden" style="margin-left:8px">Install AVIA</button>',1)
          script='''\n<script>\n(function(){\nlet promptEvent=null;const b=()=>document.getElementById('installPwaBtn');\nconst standalone=()=>window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;\nwindow.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;if(!standalone())b()?.classList.remove('hidden');});\nwindow.addEventListener('appinstalled',()=>{promptEvent=null;b()?.classList.add('hidden');});\ndocument.addEventListener('click',async e=>{if(e.target?.id!=='installPwaBtn')return;if(promptEvent){promptEvent.prompt();try{await promptEvent.userChoice}catch(_){}promptEvent=null;b()?.classList.add('hidden');}else alert('Dalam Chrome/Edge: buka menu browser dan pilih Install AVIA / Install app.');});\nif('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));\nif(standalone())b()?.classList.add('hidden');\n})();\n</script>\n'''
          if "navigator.serviceWorker.register('./sw.js'" not in s:
              s=s.replace('</body>',script+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          cat > web/manifest.webmanifest <<'EOF'
          {
            "id": "./",
            "name": "AVIA — Availability & Visibility Information Application",
            "short_name": "AVIA",
            "description": "AVIA UNIT IT — pergerakan staf, status, birthday, pengumuman dan pentadbiran.",
            "lang": "ms-MY",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "display_override": ["standalone", "minimal-ui"],
            "orientation": "any",
            "background_color": "#ffffff",
            "theme_color": "#0b5ea8",
            "categories": ["business", "productivity"],
            "prefer_related_applications": false,
            "icons": [
              {"src":"icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}
            ]
          }
          EOF
          cat > web/sw.js <<'EOF'
          const CACHE='avia-web-v4';
          const SHELL=['./','./index.html','./manifest.webmanifest','./offline.html','./icons/icon-512.png'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(SHELL)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{const r=e.request,u=new URL(r.url);if(r.method!=='GET'||u.hostname.endsWith('.supabase.co'))return;if(r.mode==='navigate'){e.respondWith(fetch(r).then(x=>{if(x&&x.ok){const c=x.clone();caches.open(CACHE).then(k=>k.put('./index.html',c));}return x;}).catch(()=>caches.match('./index.html').then(x=>x||caches.match('./offline.html'))));return;}e.respondWith(caches.match(r).then(cached=>cached||fetch(r).then(x=>{if(x&&x.ok&&u.origin===self.location.origin){const c=x.clone();caches.open(CACHE).then(k=>k.put(r,c));}return x;})));});
          EOF
          cat > web/offline.html <<'EOF'
          <!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5ea8"><title>AVIA Offline</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f4f7fb;color:#17324d}.box{max-width:520px;margin:20px;padding:28px;background:white;border-radius:18px;box-shadow:0 8px 30px #0001;text-align:center}.muted{opacity:.72}</style><div class="box"><h1>AVIA</h1><p>Tiada sambungan internet.</p><p class="muted">Sambungkan internet dan buka semula AVIA untuk sync data Supabase.</p></div></html>
          EOF
          cat > web/vercel.json <<'EOF'
          {
            "headers": [
              {"source":"/sw.js","headers":[{"key":"Cache-Control","value":"public, max-age=0, must-revalidate"}]},
              {"source":"/manifest.webmanifest","headers":[{"key":"Content-Type","value":"application/manifest+json; charset=utf-8"},{"key":"Cache-Control","value":"public, max-age=0, must-revalidate"}]},
              {"source":"/(.*)","headers":[{"key":"X-Content-Type-Options","value":"nosniff"},{"key":"Referrer-Policy","value":"strict-origin-when-cross-origin"}]}
            ]
          }
          EOF
          printf '{"app":"AVIA","source_branch":"avia-web-pwa","source_commit":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > web/version.json
          touch web/.nojekyll
          grep -q 'AVIA_SUPABASE_FIXED' web/index.html
          grep -q 'hdfshop2010@gmail.com' web/index.html
          grep -q 'installPwaBtn' web/index.html
          grep -q 'serviceWorker' web/index.html
          grep -q 'avia-web-v4' web/sw.js
          python3 -m json.tool web/manifest.webmanifest >/dev/null
          python3 -m json.tool web/vercel.json >/dev/null
          test -s web/index.html
          test -s web/manifest.webmanifest
          test -s web/sw.js
          test -s web/offline.html
          test -s web/icons/icon-512.png
          test -s web/version.json

      - name: Apply fixed staff display order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text(encoding='utf-8')
          marker="function toggleStaffUnit(id){const el=g(id);if(el)el.classList.toggle('collapsed')}"
          helper="""const AVIA_STAFF_DISPLAY_ORDER=[
          'KHAIRANI FAIDZAH BINTI DOLAH',
          'NUR BALKIS BINTI YAACOB',
          'AIN SYAHEERA BINTI ABD RAHMAN',
          'MOHD KHAIRI BIN ZAKARIA',
          'MOHAMAD TAZLY BIN YAHYA',
          'IZZUWAN HAKIM BIN KAMARUZZAMAN'
          ];
          const AVIA_STAFF_DISPLAY_RANK=new Map(AVIA_STAFF_DISPLAY_ORDER.map((n,i)=>[n,i]));
          function sortAviaStaff(list){return [...list].sort((a,b)=>{const an=String(a?.full_name||a?.email||'').trim().toUpperCase(),bn=String(b?.full_name||b?.email||'').trim().toUpperCase(),ar=AVIA_STAFF_DISPLAY_RANK.has(an)?AVIA_STAFF_DISPLAY_RANK.get(an):9999,br=AVIA_STAFF_DISPLAY_RANK.has(bn)?AVIA_STAFF_DISPLAY_RANK.get(bn):9999;if(ar!==br)return ar-br;return an.localeCompare(bn,'ms')})}
          """
          if 'AVIA_STAFF_DISPLAY_ORDER' not in s:
              if marker not in s: raise SystemExit('staff render marker not found')
              s=s.replace(marker,helper+marker,1)
          old_people="const people=groups[u].sort((a,b)=>(a.full_name||a.email||'').localeCompare((b.full_name||b.email||''),'ms'));"
          if old_people not in s: raise SystemExit('staff list sort marker not found')
          s=s.replace(old_people,"const people=sortAviaStaff(groups[u]);")
          old_today="return scopeStaff().filter(s=>(`${s.full_name||''} ${s.email||''}`).toLowerCase().includes(q));"
          if old_today not in s: raise SystemExit('today staff sort marker not found')
          s=s.replace(old_today,"return sortAviaStaff(scopeStaff().filter(s=>(`${s.full_name||''} ${s.email||''}`).toLowerCase().includes(q)));",1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'AVIA_STAFF_DISPLAY_ORDER' web/index.html
          grep -q "const people=sortAviaStaff(groups\[u\])" web/index.html

      - name: Harden mobile login network retry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text(encoding='utf-8')
          marker='async function loginRemote(){'
          if marker not in s: raise SystemExit('loginRemote marker not found')
          patch="""const AVIA_MOBILE_FETCH_RETRY=true;
          const _aviaApiFetchBase=api;
          api=async function(path,opt={}){
            const method=String(opt.method||'GET').toUpperCase();
            const attempts=method==='GET'?3:1;
            let last=null;
            for(let i=1;i<=attempts;i++){
              try{return await _aviaApiFetchBase(path,opt)}catch(e){
                last=e;
                const transient=/failed to fetch|networkerror|load failed|network request failed/i.test(String(e?.message||e));
                if(!transient||i===attempts){
                  if(transient)throw new Error('Sambungan ke server terganggu. Sila cuba lagi.');
                  throw e;
                }
                await new Promise(r=>setTimeout(r,350*i));
              }
            }
            throw last;
          };
          const _aviaLoginRemoteBase=loginRemote;
          let AVIA_LOGIN_PROMISE=null;
          loginRemote=async function(){
            if(AVIA_LOGIN_PROMISE)return AVIA_LOGIN_PROMISE;
            AVIA_LOGIN_PROMISE=_aviaLoginRemoteBase();
            try{return await AVIA_LOGIN_PROMISE}finally{AVIA_LOGIN_PROMISE=null}
          };
          """
          if 'AVIA_MOBILE_FETCH_RETRY' not in s:
              s=s.replace(marker,patch+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'AVIA_MOBILE_FETCH_RETRY=true' web/index.html
          grep -q 'AVIA_LOGIN_PROMISE' web/index.html

      - name: Fix forced password change action
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text(encoding='utf-8')
          old_btn='<div class="actions" style="margin-top:12px"><button id="changeOwnPasswordBtn" type="button">Tukar Password</button></div>'
          new_btn='<div class="actions" style="margin-top:12px"><button id="changeOwnPasswordBtn" type="button" onclick="changeOwnPassword()">Tukar Password</button></div><div id="forcePasswordMsg" class="muted" style="margin-top:8px"></div>'
          if old_btn not in s: raise SystemExit('force password button marker not found')
          s=s.replace(old_btn,new_btn,1)
          old_bind="window.addEventListener('focus',()=>{if(TOKEN&&!demo)syncAll()});g('changeOwnPasswordBtn')?.addEventListener('click',changeOwnPassword);"
          if old_bind not in s: raise SystemExit('force password listener marker not found')
          s=s.replace(old_bind,"window.addEventListener('focus',()=>{if(TOKEN&&!demo)syncAll()});",1)
          old_start="async function changeOwnPassword(){\n  const p1=g('newOwnPassword').value,p2=g('confirmOwnPassword').value;\n  if(p1.length<8)return alert('Password baharu minimum 8 aksara.');\n  if(p1!==p2)return alert('Password tidak sepadan.');"
          new_start="async function changeOwnPassword(){\n  const msg=g('forcePasswordMsg'),btn=g('changeOwnPasswordBtn');\n  const fail=t=>{if(msg)msg.textContent=t;else alert(t)};\n  if(msg)msg.textContent='';\n  const p1=g('newOwnPassword').value,p2=g('confirmOwnPassword').value;\n  if(p1.length<8)return fail('Password baharu minimum 8 aksara.');\n  if(p1!==p2)return fail('Password tidak sepadan.');"
          if old_start not in s: raise SystemExit('changeOwnPassword start marker not found')
          s=s.replace(old_start,new_start,1)
          old_fetch="  try{\n    const r=await fetch(CFG.url.replace(/\\/$/,'')+'/auth/v1/user',{"
          new_fetch="  try{\n    if(btn)btn.disabled=true;\n    if(msg)msg.textContent='Menyimpan password baharu...';\n    const r=await fetch(CFG.url.replace(/\\/$/,'')+'/auth/v1/user',{"
          if old_fetch not in s: raise SystemExit('changeOwnPassword fetch marker not found')
          s=s.replace(old_fetch,new_fetch,1)
          old_done="    g('newOwnPassword').value='';g('confirmOwnPassword').value='';\n    alert('Password berjaya ditukar.');\n  }catch(e){alert(e.message)}\n}\nfunction enforcePasswordChange(){"
          new_done="    g('newOwnPassword').value='';g('confirmOwnPassword').value='';\n    if(msg)msg.textContent='Password berjaya ditukar.';\n    alert('Password berjaya ditukar.');\n  }catch(e){fail(e.message||'Gagal tukar password.')}finally{if(btn)btn.disabled=false}\n}\nfunction enforcePasswordChange(){"
          if old_done not in s: raise SystemExit('changeOwnPassword completion marker not found')
          s=s.replace(old_done,new_done,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'onclick="changeOwnPassword()"' web/index.html
          grep -q 'Menyimpan password baharu' web/index.html
          grep -q 'forcePasswordMsg' web/index.html

      - name: Upload web package
        uses: actions/upload-artifact@v4
        with:
          name: AVIA-Web-PWA
          path: web
          if-no-files-found: error

      - name: Publish avia-web-dist branch
        shell: bash
        run: |
          set -euo pipefail
          tar -C web -czf /tmp/avia-web.tgz .
          git config user.name "AVIA Build"
          git config user.email "actions@github.com"
          git checkout --orphan avia-web-dist
          git rm -rf . || true
          git clean -fdx
          tar -xzf /tmp/avia-web.tgz
          git add -A
          git commit -m "Publish AVIA Web PWA"
          git push --force origin HEAD:avia-web-dist
